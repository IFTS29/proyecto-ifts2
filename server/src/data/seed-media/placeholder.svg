<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d54"/>
      <stop offset="50%" stop-color="#004b87"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Fondo Institucional -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Tramado sutil geométrico de fondo -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="400" cy="220" r="180"/>
    <circle cx="400" cy="220" r="260"/>
    <circle cx="400" cy="220" r="340"/>
    <line x1="0" y1="0" x2="800" y2="500"/>
    <line x1="800" y1="0" x2="0" y2="500"/>
  </g>

  <!-- Escudo Central Institucional -->
  <g transform="translate(400, 180)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="url(#badgeGrad)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
    <!-- Ícono de Cámara / Multimedia -->
    <path d="M-22,-6 L-15,-16 L15,-16 L22,-6 L26,-6 C29,-6 32,-3 32,1 L32,18 C32,22 29,25 26,25 L-26,25 C-29,25 -32,22 -32,18 L-32,1 C-32,-3 -29,-6 -26,-6 Z" fill="#002d54"/>
    <circle cx="0" cy="9" r="10" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="0" cy="9" r="4" fill="#f59e0b"/>
  </g>

  <!-- Tipografía Institucional -->
  <text x="400" y="295" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">GOBIERNO DE LA CIUDAD DE BUENOS AIRES</text>
  <text x="400" y="335" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="0.5" text-anchor="middle">IFTS N.° 29</text>
  <text x="400" y="365" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Tecnicatura Superior en Desarrollo de Software</text>

  <!-- Subtítulo de contingencia -->
  <rect x="270" y="395" width="260" height="30" rx="15" fill="rgba(255, 255, 255, 0.1)"/>
  <text x="400" y="415" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PUBLICACIÓN INSTITUCIONAL</text>
</svg>